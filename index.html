<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI or Real?</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        .game {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .image-box {
            width: 100%;
            height: 400px;
            background: #ddd;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
        }

        .image-box p {
            font-size: 24px;
            color: #666;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .ai-button {
            background: #222;
            color: white;
        }

        .real-button {
            background: white;
            border: 2px solid #222;
        }

        button:hover {
            transform: scale(1.05);
        }

        .score {
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>AI OR REAL?</h1>
        <p>Can you tell which images are AI-generated?</p>
    </header>

    <main class="game">

        <div class="image-box">
    <img src="images/Screenshot 2026-09-20 233919.png" alt="Mystery image">
        </div>
        <div class="buttons">
            <button class="ai-button">
                🤖 AI
            </button>

            <button class="real-button">
                📷 REAL
            </button>
        </div>

        <div class="score">
            Score: 0
        </div>

    </main>

</body>
</html>
